name: alhuda
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 2.2.0+7

environment:
  sdk: ^3.9.2

dependencies:
  android_alarm_manager_plus: ^5.1.1
  audioplayers: ^6.1.0
  connectivity_plus: ^7.3.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^20.1.0
  flutter_native_splash: ^2.4.7
  flutter_qiblah: ^3.2.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  geolocator: ^14.0.2
  hijri_date: ^1.1.0
  http: ^1.2.0
  just_audio: ^0.10.6
  muslim_data_flutter: ^1.4.1
  path_provider: ^2.1.5
  qibla: ^1.1.0
  quran: ^1.3.3
  quran_kit: ^0.2.0
  upgrader: ^13.7.0
  url_launcher: ^6.3.2
  youtube_player_flutter: ^9.1.3

dev_dependencies:
  bloc_test: ^10.0.0
  change_app_package_name: ^1.5.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/audio/
    - assets/hadith/
    - assets/hadith/bukhari/
    - assets/hadith/bukhari/chapters/
    - assets/hadith/muslim/
    - assets/hadith/muslim/chapters/
    - assets/hadith/nawawi40/
    - assets/hadith/nawawi40/chapters/

  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Bold.ttf
        - asset: assets/fonts/Almarai-ExtraBold.ttf
        - asset: assets/fonts/Almarai-Light.ttf
        - asset: assets/fonts/Almarai-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri-Italic.ttf
          style: italic
        - asset: assets/fonts/Amiri-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Black.ttf
        - asset: assets/fonts/Rubik-BlackItalic.ttf
        - asset: assets/fonts/Rubik-Bold.ttf
        - asset: assets/fonts/Rubik-BoldItalic.ttf
        - asset: assets/fonts/Rubik-ExtraBold.ttf
        - asset: assets/fonts/Rubik-ExtraBoldItalic.ttf
        - asset: assets/fonts/Rubik-Italic.ttf
        - asset: assets/fonts/Rubik-Light.ttf
        - asset: assets/fonts/Rubik-LightItalic.ttf
        - asset: assets/fonts/Rubik-Medium.ttf
        - asset: assets/fonts/Rubik-MediumItalic.ttf
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-SemiBold.ttf
        - asset: assets/fonts/Rubik-SemiBoldItalic.ttf
